# Installation mit dem fertigen Image – kein Git und kein Quellcode nötig.
#   docker compose -f docker-compose.image.yml up -d
# Update:
#   docker compose -f docker-compose.image.yml pull && docker compose -f docker-compose.image.yml up -d
# Statt „latest“ kann eine feste Version stehen, z. B. ghcr.io/bitnike/immobilienverwalter:0.9.0
services:
  immobilienverwalter:
    image: ghcr.io/bitnike/immobilienverwalter:latest
    container_name: immobilienverwalter
    restart: unless-stopped
    env_file:
      - path: .env          # optional: SMTP und APP_URL, Vorlage siehe .env.example
        required: false
    ports:
      - "${NK_PORT:-8080}:8080"
    volumes:
      - daten:/data              # Datenbank, Profilfotos, Logo
      - dokumente:/dokumente     # hochgeladene Belege und Ablage

volumes:
  daten:
    name: immobilienverwalter_daten
  dokumente:
    name: immobilienverwalter_dokumente
