{% extends "einstellungen/_layout.html" %}
{% from "_ui.html" import speichern %}
{% block title %}Passwort ändern{% endblock %}
{% block panel %}
<h1>Passwort ändern</h1>
<form method="post" class="schmal">
  <label>Aktuelles Passwort<input type="password" name="alt" autocomplete="current-password" required></label>
  <label>Neues Passwort<input type="password" name="passwort" autocomplete="new-password" minlength="8" required></label>
  <label>Wiederholen<input type="password" name="passwort2" autocomplete="new-password" minlength="8" required></label>
  <div class="knopfleiste">{{ speichern() }}</div>
</form>
{% endblock %}
