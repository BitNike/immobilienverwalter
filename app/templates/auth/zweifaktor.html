{% extends "auth/_layout.html" %}
{% from "_ui.html" import icon %}
{% block title %}Bestätigungscode{% endblock %}
{% block karte %}
<h1>Bestätigungscode</h1>
<p class="leise">Bitte den 6-stelligen Code aus deiner Authenticator-App eingeben – oder einen deiner Notfall-Codes.</p>
<form method="post">
  <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
  <button class="btn voll">{{ icon('right') }}<span>Anmelden</span></button>
</form>
<p class="leise"><a href="{{ url_for('login') }}">Abbrechen</a></p>
{% endblock %}
