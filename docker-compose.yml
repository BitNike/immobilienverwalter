services:
  nebenkosten:
    build: .
    container_name: nebenkosten
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${NK_PORT:-8080}:8080"   # Port auf dem Server, einstellbar in .env
    volumes:
      - nk-daten:/data            # Datenbank, Profilfotos, Logo
      - nk-dokumente:/dokumente   # hochgeladene Belege: <Immobilie>/<Jahr>/Vermieter|Mieter/...

# Feste Volume-Namen: Daten bleiben erhalten, auch wenn Ordner oder Projekt umbenannt werden.
volumes:
  nk-daten:
    name: nebenkostenabrechnung_nk-daten
  nk-dokumente:
    name: nebenkostenabrechnung_nk-dokumente
