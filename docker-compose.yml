# Immobilienverwalter mit dem fertigen Image.
# Start:  docker compose up -d
# Update: docker compose pull && docker compose up -d
# Danach im Browser: http://<IP-des-Rechners>:8080

services:
  immobilienverwalter:
    image: ghcr.io/bitnike/immobilienverwalter:latest
    container_name: immobilienverwalter
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${NK_PORT:-8080}:8080"
    volumes:
      - daten:/data
      - dokumente:/dokumente

volumes:
  daten:
    name: immobilienverwalter_daten
  dokumente:
    name: immobilienverwalter_dokumente
